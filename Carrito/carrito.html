<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="carrito.css">
</head>
<body>
    <a href="#" class="volver">Volver a principal</a>

    <div class="cabecera">
        <p>CABECERA</p>
        <img src="Imagenes/carrito.png" alt="Carrito">
    </div>

    <div class="contenido">
        <h1>Carrito de la compra</h1>

        <div class="producto">
            <img src="https://via.placeholder.com/100" alt="Producto 1">
            <div class="detalle">
                <h2>Producto 1</h2>
                <p>Descripción del producto 1.</p>
                <p class="precio">10,00 €</p>
            </div>
        </div>

        <div class="producto">
            <img src="https://via.placeholder.com/100" alt="Producto 2">
            <div class="detalle">
                <h2>Producto 2</h2>
                <p>Descripción del producto 2.</p>
                <p class="precio">15,00 €</p>
            </div>
        </div>

        <div class="total">
            <p>Total: <strong>25,00 €</strong></p>
            <button>Finalizar compra</button>
        </div>
    </div>
</body>
</html>
